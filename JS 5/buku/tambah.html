<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Rental Motor Lowokwaru | Tambah Motor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <header>

        <a class="brand" href="../index.html">
            <h1>Rental Motor Lowokwaru</h1>
        </a>

        <input type="checkbox" id="nav-toggle" class="nav-toggle">

        <label for="nav-toggle" class="nav-toggle-label">
            <span></span>
            <span></span>
            <span></span>
        </label>

        <nav>
            <ul>

                <li>
                    <a href="../index.html">
                        <i class="bi bi-house-door-fill"></i>
                        Beranda
                    </a>
                </li>

                <li>
                    <a href="list.html">
                        <i class="bi bi-book-fill"></i>
                        Daftar Motor
                    </a>
                </li>

                <li>
                    <a class="active" href="tambah.html">
                        <i class="bi bi-plus-circle-fill"></i>
                        Tambah Motor
                    </a>
                </li>

                <li>
                    <a href="../anggota/list.html">
                        <i class="bi bi-people-fill"></i>
                        Daftar Pelanggan
                    </a>
                </li>

                <li>
                    <a href="../anggota/tambah.html">
                        <i class="bi bi-person-plus-fill"></i>
                        Tambah Pelanggan
                    </a>
                </li>

            </ul>
        </nav>

    </header>

    <main>

        <section>

            <h2>
                <i class="bi bi-plus-circle-fill"></i>
                Tambah Motor
            </h2>

            <p class="page-description">
                Tambahkan spesifikasi motor baru ke armada rental.
            </p>

            <form id="form-tambah">

                <p>
                    <label for="plat_nomor">Plat Nomor</label>
                    <input type="text" id="plat_nomor" name="plat_nomor" required>
                </p>

                <p>
                    <label for="merek">Merek dan Model</label>
                    <input type="text" id="merek" name="merek" required>
                </p>

                <p>
                    <label for="tahun">Tahun</label>
                    <input type="number" id="tahun" name="tahun" min="1900" max="2026" required>
                </p>

                <p>
                    <label for="isbn">Warna</label>
                    <input type="text" id="isbn" name="isbn">
                </p>

                <p>
                    <label for="stok">Harga Sewa/Hari</label>
                    <input type="number" id="stok" name="stok" min="0" required>
                </p>

                <p>
                    <label for="kategori">Jenis Motor</label>
                    <select id="kategori" name="kategori">
                        <option value="matic">Matic</option>
                        <option value="bebek">Bebek</option>
                        <option value="sport">Sport</option>
                        <option value="trail">Trail</option>
                    </select>
                </p>

                <button type="submit">
                    <i class="bi bi-save-fill"></i>
                    Simpan
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Rental Motor Malang Lowokwaru</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>

</body>
</html>
