<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIMPUS-Mini | Beranda</title>
  </head>
  <body>
    <header>
      <h1>SIMPUS-Mini</h1>
      <nav>
        <ul>
          <li><a href="../index.html">Beranda</a></li>
          <li><a href="list.html">Daftar Buku</a></li>
          <li><a href="tambah.html">Tambah Buku</a></li>
          <li><a href="../anggota/list.html">Daftar Anggota</a></li>
          <li><a href="../anggota/tambah.html">Tambah Anggota</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <form>
        <p>
          <label for="judul">Judul</label><br />
          <input type="text" name="judul" id="judul" required />
        </p>
        <p>
          <label for="pengarang">Pengarang</label><br />
          <input type="text" name="pengarang" id="pengarang" required />
        </p>
        <p>
          <label for="tahun">Tahun Terbit</label><br />
          <input
            type="number"
            name="tahun"
            id="tahun"
            min="1990"
            max="2026"
            required
          />
        </p>
        <p>
          <label for="isbn">ISBN</label><br />
          <input type="number" name="isbn" id="isbn" required />
        </p>
        <p>
          <label for="stok">Stok</label><br />
          <input type="number" name="stok" id="stok" min="0" required />
        </p>
        <p>
          <label for="kategori">Kategori</label><br />
          <select id="kategori" name="kategori">
            <option value="fiksi">Fiksi</option>
            <option value="non-fiksi">Non-Fiksi</option>
            <option value="referensi">Referensi</option>
          </select>
        </p>
        <p>
          <button type="submit">Simpan</button>
        </p>
      </form>
    </main>
    <footer>
      <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 1.</p>
    </footer>
  </body>
</html>
