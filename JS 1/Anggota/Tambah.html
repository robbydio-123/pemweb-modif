<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIMPUS-Mini | Beranda</title>
  </head>
  <body>
    <header>
      <h1>SIMPUS-Mini</h1>
      <nav>
        <ul>
          <li><a href="../index.html">Beranda</a></li>
          <li><a href="../buku/list.html">Daftar Buku</a></li>
          <li><a href="../buku/tambah.html">Tambah Buku</a></li>
          <li><a href="list.html">Daftar Anggota</a></li>
          <li><a href="tambah.html">Tambah Anggota</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <form>
        <p>
          <label for="nama">Nama</label><br />
          <input type="text" id="nama" name="nama" required />
        </p>
        <p>
          <label for="no_anggota">No. Anggota</label><br />
          <input type="text" id="no_anggota" name="no_anggota" required />
        </p>
        <p>
          <label for="alamat">Alamat</label><br />
          <input type="text" id="alamat" name="alamat" />
        </p>
        <p>
          <label for="no_hp">No. HP</label><br />
          <input type="text" id="no_hp" name="no_hp" />
        </p>
        <p>
          <label for="tanggal_bergabung">Tanggal Bergabung</label><br />
          <input type="date" id="tanggal_bergabung" name="tanggal_bergabung" min="1990-01-01" max="2026-12-31"/>
        </p>
        <p>
          <label for="email">Email</label><br />
          <input type="email" id="email" name="email" />
        </p>
        <p>
          <button type="submit">Simpan</button>
        </p>
      </form>
    </main>
    <footer>
      <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 1.</p>
    </footer>
  </body>
</html>
