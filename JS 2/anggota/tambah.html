<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Rental Motor Lowokwaru | Tambah Pelanggan</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
    <header>
        <h1>Rental Motor Lowokwaru</h1>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="../buku/list.html">Daftar Motor</a></li>
                <li><a href="list.html">Daftar Pelanggan</a></li>
                <li><a href="tambah.html">Tambah Pelanggan</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Tambah Pelanggan</h2>
            <form>
                <p>
                    <label for="nama">Nama</label><br>
                    <input type="text" id="nama" name="nama" required>
                </p>
                <p>
                    <label for="no_pelanggan">No. Pelanggan</label><br>
                    <input type="text" id="no_pelanggan" name="no_pelanggan" required>
                </p>
                <p>
                    <label for="no_ktp">No. KTP</label><br>
                    <input type="text" id="no_ktp" name="no_ktp" required>
                </p>
                <p>
                    <label for="alamat">Alamat</label><br>
                    <input type="text" id="alamat" name="alamat">
                </p>
                <p>
                    <label for="no_hp">No. HP</label><br>
                    <input type="text" id="no_hp" name="no_hp">
                </p>
                <p>
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Rental Motor Malang Lowokwaru</p>
    </footer>
</body>
</html>
