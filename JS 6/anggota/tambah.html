<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rental Motor Lowokwaru | Tambah Pelanggan</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <header>

        <a class="brand" href="../index.html">
            <h1>Rental Motor Lowokwaru</h1>
        </a>

        <input type="checkbox" id="nav-toggle" class="nav-toggle">

        <label for="nav-toggle" class="nav-toggle-label">
            <span></span>
            <span></span>
            <span></span>
        </label>

        <nav>
            <ul>

                <li>
                    <a href="../index.html">
                        <i class="bi bi-speedometer2"></i>
                        Beranda
                    </a>
                </li>

                <li>
                    <a href="../buku/list.html">
                        <i class="bi bi-scooter"></i>
                        Daftar Motor
                    </a>
                </li>

                <li>
                    <a href="../buku/tambah.html">
                        <i class="bi bi-plus-square-fill"></i>
                        Tambah Motor
                    </a>
                </li>

                <li>
                    <a href="list.html">
                        <i class="bi bi-person-vcard-fill"></i>
                        Daftar Pelanggan
                    </a>
                </li>

                <li>
                    <a class="active" href="tambah.html">
                        <i class="bi bi-person-plus-fill"></i>
                        Tambah Pelanggan
                    </a>
                </li>

                <li>
                    <a href="../penyewaan/list.html">
                        <i class="bi bi-key-fill"></i>
                        Penyewaan
                    </a>
                </li>
            </ul>
        </nav>

    </header>

    <main>

        <section>

            <h2>
                <i class="bi bi-person-plus-fill"></i>
                Tambah Pelanggan
            </h2>

            <p class="page-description">
                Tambahkan data pelanggan baru Rental Motor Lowokwaru.
            </p>

            <form id="form-tambah">

                <p>
                    <label for="nama">Nama</label>
                    <input type="text" id="nama" name="nama" required>
                </p>

                <p>
                    <label for="no_pelanggan">No. Pelanggan</label>
                    <input type="text" id="no_pelanggan" name="no_pelanggan" required>
                </p>

                <p>
                    <label for="no_ktp">No. KTP</label>
                    <input type="text" id="no_ktp" name="no_ktp" minlength="16" maxlength="16" required>
                </p>

                <p>
                    <label for="alamat">Alamat</label>
                    <input type="text" id="alamat" name="alamat">
                </p>

                <p>
                    <label for="no_hp">No. HP</label>
                    <input type="text" id="no_hp" name="no_hp">
                </p>

                <button type="submit">
                    <i class="bi bi-check2-circle"></i>
                    Simpan
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Sewa Rental Motor Malang Lowokwaru</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>

</body>
</html>
