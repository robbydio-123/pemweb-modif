<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rental Motor Lowokwaru | Sewa Motor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<header>
    <a class="brand" href="../index.html"><h1>Rental Motor Lowokwaru</h1></a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-toggle-label"><span></span><span></span><span></span></label>
    <nav><ul>
        <li><a href="../index.html"><i class="bi bi-speedometer2"></i> Beranda</a></li>
        <li><a href="../buku/list.html"><i class="bi bi-scooter"></i> Daftar Motor</a></li>
        <li><a href="../anggota/list.html"><i class="bi bi-person-vcard-fill"></i> Pelanggan</a></li>
        <li><a href="list.html"><i class="bi bi-key-fill"></i> Penyewaan</a></li>
        <li><a class="active" href="tambah.html"><i class="bi bi-plus-square-fill"></i> Sewa Motor</a></li>
    </ul></nav>
</header>
<main><section>
    <h2><i class="bi bi-key-fill"></i> Sewa Motor</h2>
    <p class="page-description">Catat penyewaan motor pelanggan.</p>
    <form id="form-penyewaan">
        <p><label for="nama_pelanggan">Pelanggan</label><input id="nama_pelanggan" name="nama_pelanggan" required placeholder="Nama pelanggan"></p>
        <p><label for="plat_nomor">Plat Nomor Motor</label><input id="plat_nomor" name="plat_nomor" required placeholder="N 1234 AB"></p>
        <p><label for="harga_sewa_per_hari">Harga Sewa/Hari</label><input type="number" id="harga_sewa_per_hari" name="harga_sewa_per_hari" min="0" required></p>
        <p><label for="tanggal_sewa">Tanggal Sewa</label><input type="date" id="tanggal_sewa" name="tanggal_sewa" required></p>
        <p><label for="tanggal_kembali">Tanggal Kembali</label><input type="date" id="tanggal_kembali" name="tanggal_kembali" required></p>
        <p><label for="lama_sewa">Lama Sewa</label><input id="lama_sewa" readonly></p>
        <p><label for="total_biaya">Total Biaya</label><input id="total_biaya" readonly></p>
        <p><label for="denda">Denda Keterlambatan</label><input id="denda" readonly value="Rp0"></p>
        <button type="submit"><i class="bi bi-check2-circle"></i> Simpan Penyewaan</button>
    </form>
</section></main>
<footer><p>&copy; 2026 Sewa Rental Motor Malang Lowokwaru</p></footer>
<script src="../assets/js/app.js"></script><script src="../assets/js/penyewaan.js"></script>
</body></html>
