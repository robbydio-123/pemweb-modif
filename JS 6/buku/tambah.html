<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rental Motor Lowokwaru | Tambah Motor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../assets/css/style.css">
</head>

<body>

    <header>

        <a class="brand" href="../index.html">
            <h1>Rental Motor Lowokwaru</h1>
        </a>

        <input type="checkbox" id="nav-toggle" class="nav-toggle">

        <label for="nav-toggle" class="nav-toggle-label">
            <span></span>
            <span></span>
            <span></span>
        </label>

        <nav>
            <ul>

                <li>
                    <a href="../index.html">
                        <i class="bi bi-speedometer2"></i>
                        Beranda
                    </a>
                </li>

                <li>
                    <a href="list.html">
                        <i class="bi bi-scooter"></i>
                        Daftar Motor
                    </a>
                </li>

                <li>
                    <a class="active" href="tambah.html">
                        <i class="bi bi-plus-square-fill"></i>
                        Tambah Motor
                    </a>
                </li>

                <li>
                    <a href="../anggota/list.html">
                        <i class="bi bi-person-vcard-fill"></i>
                        Daftar Pelanggan
                    </a>
                </li>

                <li>
                    <a href="../anggota/tambah.html">
                        <i class="bi bi-person-plus-fill"></i>
                        Tambah Pelanggan
                    </a>
                </li>

                <li>
                    <a href="../penyewaan/list.html">
                        <i class="bi bi-key-fill"></i>
                        Penyewaan
                    </a>
                </li>
            </ul>
        </nav>

    </header>

    <main>

        <section>

            <h2>
                <i class="bi bi-plus-square-fill"></i>
                Tambah Motor
            </h2>

            <p class="page-description">
                Tambahkan spesifikasi motor baru ke armada rental.
            </p>

            <form id="form-tambah">

                <p>
                    <label for="plat_nomor">Plat Nomor</label>
                    <input type="text" id="plat_nomor" name="plat_nomor" required>
                </p>

                <p>
                    <label for="merek">Merek</label>
                    <input type="text" id="merek" name="merek" required>
                </p>

                <p>
                    <label for="model">Model</label>
                    <input type="text" id="model" name="model" required>
                </p>

                <p>
                    <label for="tahun">Tahun</label>
                    <input type="number" id="tahun" name="tahun" min="1990" max="2026" required>
                </p>

                <p>
                    <label for="warna">Warna</label>
                    <input type="text" id="warna" name="warna" required>
                </p>

                <p>
                    <label for="jenis">Jenis</label>
                    <select id="jenis" name="jenis">
                        <option value="Matic">Matic</option>
                        <option value="Bebek">Bebek</option>
                        <option value="Sport">Sport</option>
                        <option value="Trail">Trail</option>
                    </select>
                </p>

                <p>
                    <label for="kapasitas_cc">Kapasitas (CC)</label>
                    <input type="number" id="kapasitas_cc" name="kapasitas_cc" min="50" required>
                </p>

                <p>
                    <label for="harga_sewa_per_hari">Harga Sewa/Hari</label>
                    <input type="number" id="harga_sewa_per_hari" name="harga_sewa_per_hari" min="0" required>
                </p>

                <button type="submit">
                    <i class="bi bi-check2-circle"></i>
                    Simpan
                </button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Sewa Rental Motor Malang Lowokwaru</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/app.js"></script>

</body>
</html>
