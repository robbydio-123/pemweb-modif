    <!DOCTYPE html>
    <html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Rental Motor Lowokwaru | Tambah Motor</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="../assets/style.css">
    </head>
    <body>
        <header class="navbar navbar-expand-lg navbar-dark" style="background-color:#1d8a44;">
            <div class="container">
                <a class="navbar-brand fw-semibold" href="../index.html">Rental Motor Lowokwaru</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <nav class="collapse navbar-collapse" id="navMenu">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                        <li class="nav-item"><a class="nav-link" href="list.html">Daftar Motor</a></li>
                        <li class="nav-item"><a class="nav-link active" href="tambah.html">Tambah Motor</a></li>
                        <li class="nav-item"><a class="nav-link" href="../anggota/list.html">Daftar Pelanggan</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <main class="container my-4">
            <section class="card shadow-sm mb-4">
                <div class="card-body">
                    <h2 class="card-title mb-3" style="color:#1d8a44;">Tambah Motor</h2>
                    <form>
                        <div class="mb-3">
                            <label for="judul" class="form-label fw-semibold">Plat Nomor</label>
                            <input type="text" class="form-control" id="judul" name="judul" required>
                        </div>
                        <div class="mb-3">
                            <label for="pengarang" class="form-label fw-semibold">Merek dan Model</label>
                            <input type="text" class="form-control" id="pengarang" name="pengarang" required>
                        </div>
                        <div class="mb-3">
                            <label for="tahun" class="form-label fw-semibold">Tahun</label>
                            <input type="number" class="form-control" id="tahun" name="tahun" min="1900" max="2026" required>
                        </div>
                        <div class="mb-3">
                            <label for="isbn" class="form-label fw-semibold">Warna</label>
                            <input type="text" class="form-control" id="isbn" name="isbn">
                        </div>
                        <div class="mb-3">
                            <label for="stok" class="form-label fw-semibold">Harga Sewa/Hari</label>
                            <input type="number" class="form-control" id="stok" name="stok" min="0" required>
                        </div>
                        <div class="mb-3">
                            <label for="kategori" class="form-label fw-semibold">Jenis Motor</label>
                            <select class="form-select" id="kategori" name="kategori">
                                <option value="matic">Matic</option>
                                <option value="bebek">Bebek</option>
                                <option value="sport">Sport</option>
                                <option value="trail">Trail</option>
                            </select>
                        </div>
                        <button type="submit" class="btn" style="background-color:#1d8a44; color:#fff;">Simpan</button>
                    </form>
                </div>
            </section>
        </main>

        <footer class="text-center text-secondary py-3 small">
            <p class="mb-0">&copy; 2026 Rental Motor Malang Lowokwaru</p>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
    </html>
